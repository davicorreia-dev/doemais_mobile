services:
  - type: web
    name: doemais-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: doemais-db
          property: connectionString
    autoDeploy: true

databases:
  - name: doemais-db
    databaseName: doemais_prod
    user: doemais_user
    plan: free
