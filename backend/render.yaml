services:
  - type: web
    name: doemais-api
    env: node
    plan: free
    buildCommand: npm ci && npm run build && npx prisma migrate deploy --skip-generate
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    autoDeploy: true
    branch: main

databases:
  - name: doemais-db
    plan: free
