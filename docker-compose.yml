# Use ./run.sh --local  (db + backend + Expo + painel admin, API local)
#     ./run.sh --render (Expo + painel admin, API no Render)
# db e backend ficam no profile "local"; frontend e admin sempre sobem.
services:
  db:
    image: postgres:16
    profiles: [local]
    environment:
      POSTGRES_USER: doemais
      POSTGRES_PASSWORD: doemais
      POSTGRES_DB: doemais
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doemais"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    profiles: [local]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://doemais:doemais@db:5432/doemais?schema=public
      # gerado por máquina pelo run.sh (arquivo .env, fora do git); vazio => o backend não sobe
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-}
      NODE_ENV: development
      PORT: "3000"
      # origens permitidas (separadas por vírgula): o app web do Expo roda na 8081
      CORS_ORIGIN: http://localhost:8081,http://${HOST_IP:-localhost}:8081,http://localhost:5174
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    environment:
      # IP do PC na rede: o celular usa esse endereço para falar com o Metro e com a API
      HOST_IP: ${HOST_IP:-}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-}
      # Definido pelo run.sh (--local ou --render). Nome próprio de propósito: o Expo 58 empacota
      # arquivos .env* (ex.: frontend/.env.local) e eles sobrescreveriam EXPO_PUBLIC_API_URL.
      EXPO_PUBLIC_API_URL_OVERRIDE: ${API_URL:-http://localhost:3000}
      EXPO_NO_TELEMETRY: "1"
      # sem login/rede do Expo: evita o prompt "Log in / Proceed anonymously" que trava o Expo Go
      EXPO_OFFLINE: "1"
    ports:
      - "8081:8081"
    stdin_open: true
    tty: true
    volumes:
      - ./frontend:/app
      - /app/node_modules

  admin:
    build: ./admin
    ports:
      # só no próprio PC: o painel é um protótipo, sem autenticação real
      - "127.0.0.1:5174:5174"
    environment:
      VITE_USE_POLLING: "1"
    volumes:
      - ./admin:/app
      - /app/node_modules

volumes:
  pgdata:
