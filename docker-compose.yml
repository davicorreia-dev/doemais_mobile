# Use ./run.sh --local  (db + backend + Expo, API local)
#     ./run.sh --render (só o Expo, API no Render)
# db e backend ficam no profile "local"; o frontend sempre sobe.
services:
  db:
    image: postgres:16
    profiles: [local]
    environment:
      POSTGRES_USER: doemais
      POSTGRES_PASSWORD: doemais
      POSTGRES_DB: doemais
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doemais"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    profiles: [local]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://doemais:doemais@db:5432/doemais?schema=public
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-only-secret-troque-em-producao}
      NODE_ENV: development
      PORT: "3000"
      # origens permitidas (separadas por vírgula): o app web do Expo roda na 8081
      CORS_ORIGIN: http://localhost:8081,http://${HOST_IP:-localhost}:8081
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    environment:
      # IP do PC na rede: o celular usa esse endereço para falar com o Metro e com a API
      HOST_IP: ${HOST_IP:-}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-}
      # definido pelo run.sh (--local ou --render)
      EXPO_PUBLIC_API_URL: ${API_URL:-http://localhost:3000}
      EXPO_NO_TELEMETRY: "1"
      # sem login/rede do Expo: evita o prompt "Log in / Proceed anonymously" que trava o Expo Go
      EXPO_OFFLINE: "1"
    ports:
      - "8081:8081"
    stdin_open: true
    tty: true
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
